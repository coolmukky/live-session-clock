server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: fall back to index.html.
  location / {
    try_files $uri /index.html;
  }

  # Keep the service worker fresh so updates roll out on the next visit.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets are immutable and can be cached for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
